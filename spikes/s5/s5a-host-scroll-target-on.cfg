# Spike S5a — ChangeHost semantics + hiresscroll up/down WITH target: true.
# WARNING while running: the wheel changes the VOLUME instead of scrolling.
#   Back button (0x53)    -> ChangeHost "prev"  (expected bug on channel 1: nothing happens)
#   Forward button (0x56) -> ChangeHost "next"
devices: (
{
    name: "MX Master 3S";
    dpi: 1600;
    hiresscroll: {
        hires: false; invert: false; target: true;
        up:   { mode: "OnInterval"; interval: 1; action = { type: "Keypress"; keys: ["KEY_VOLUMEUP"]; }; };
        down: { mode: "OnInterval"; interval: 1; action = { type: "Keypress"; keys: ["KEY_VOLUMEDOWN"]; }; };
    };
    buttons: (
        { cid: 0x53; action = { type: "ChangeHost"; host: "prev"; }; },
        { cid: 0x56; action = { type: "ChangeHost"; host: "next"; }; }
    );
}
);
