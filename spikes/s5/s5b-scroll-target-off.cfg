# Spike S5b — same up/down gestures but target: false.
# Hypothesis: up/down never fire and the wheel scrolls normally.
devices: (
{
    name: "MX Master 3S";
    dpi: 1600;
    hiresscroll: {
        hires: false; invert: false; target: false;
        up:   { mode: "OnInterval"; interval: 1; action = { type: "Keypress"; keys: ["KEY_VOLUMEUP"]; }; };
        down: { mode: "OnInterval"; interval: 1; action = { type: "Keypress"; keys: ["KEY_VOLUMEDOWN"]; }; };
    };
}
);
