# Spike S6e — OnInterval with interval 0 on the thumb gesture button (0xc3).
# Hypothesis: holding the button and moving up divides by zero and kills logid.
devices: ({ name: "MX Master 3S"; dpi: 1000;
  buttons: ({ cid: 0xc3; action: { type: "Gestures"; gestures: (
    { direction: "Up"; mode: "OnInterval"; interval: 0; action: { type: "Keypress"; keys: ["KEY_VOLUMEUP"]; }; }
  ); }; });
});
