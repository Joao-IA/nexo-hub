# Spike S1 — profile form + ChangeProfile on logid 0.3.5.
# Run with: sudo systemctl stop logid && sudo logid -v -c spikes/s1/s1-profiles.cfg
# Expected: starts on "default" (DPI 1600). The button behind the wheel (0xc4)
# switches to "s1-test" (DPI 400, clearly slower) and back.
devices: (
{
    name: "MX Master 3S";
    default_profile: "default";
    profiles: (
        {
            name: "default";
            dpi: 1600;
            smartshift: { on: true; threshold: 20; };
            hiresscroll: { hires: false; invert: false; target: false; };
            buttons: (
                { cid: 0xc4; action = { type: "ChangeProfile"; profile: "s1-test"; }; }
            );
        },
        {
            name: "s1-test";
            dpi: 400;
            smartshift: { on: false; };
            buttons: (
                { cid: 0xc4; action = { type: "ChangeProfile"; profile: "default"; }; }
            );
        }
    );
}
);
