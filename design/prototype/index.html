<title>Protótipo Nexo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: moldura de janela desktop; Início = grade bento de 4 colunas; Dispositivo = palco central com o mouse + painel lateral; barra de aplicar no rodapé da janela. Paleta escolhida: Grafite + Ciano. */
:root {
  --font-display: "Bricolage Grotesque", "Onest", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", "Ubuntu", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", monospace;
  --radius-lg: 18px; --radius-md: 12px; --radius-sm: 8px;
  --bg: #e9edf1; --window: #f6f8fa; --surface: #ffffff; --surface-2: #edf1f4; --line: #d6dde3;
  --fg: #121820; --muted: #566270; --accent: #087784; --accent-soft: #d3eef1; --on-accent: #ffffff;
  --accent-glow: #10a9b8;
  --ok: #1e7f4f; --warn: #946000; --err: #bf3631;
  --stage-a: #ffffff; --stage-b: #dfe6ec;
  --shadow: 0 1px 2px rgba(16, 28, 40, .06), 0 8px 24px rgba(16, 28, 40, .08);
  --drop: rgba(20, 30, 40, .35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090c0f; --window: #11161a; --surface: #171c21; --surface-2: #1e252b; --line: #29313a;
    --fg: #e5ebf0; --muted: #8b97a3; --accent: #3fc9d6; --accent-soft: #10353a; --on-accent: #032326;
    --accent-glow: #3fc9d6;
    --ok: #4fc985; --warn: #e3b04b; --err: #f06a64;
    --stage-a: #1d252b; --stage-b: #0d1114;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35);
    --drop: rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090c0f; --window: #11161a; --surface: #171c21; --surface-2: #1e252b; --line: #29313a;
  --fg: #e5ebf0; --muted: #8b97a3; --accent: #3fc9d6; --accent-soft: #10353a; --on-accent: #032326;
  --accent-glow: #3fc9d6;
  --ok: #4fc985; --warn: #e3b04b; --err: #f06a64;
  --stage-a: #1d252b; --stage-b: #0d1114;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35);
  --drop: rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); padding-inline: 16px; padding-block: 20px 32px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: .86em; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }

/* ---- Controles do protótipo ---- */
.proto { max-width: 1240px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
.proto__title { font-family: var(--font-display); font-weight: 700; font-size: 17px; margin-right: auto; }
.proto__title small { display: block; font: 500 12px/1.3 var(--font-body); color: var(--muted); letter-spacing: .02em; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 3px; gap: 2px; align-items: center; }
.seg__label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 4px; padding-left: 8px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }

/* Vitrine da identidade */
.identity { max-width: 1240px; margin: 0 auto 16px; display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr)); gap: 12px; }
.id-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.id-card__label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.lockup { display: flex; align-items: center; gap: 14px; }
.lockup .mark { width: 64px; height: 64px; flex: none; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 44px; letter-spacing: -.03em; line-height: 1; display: inline-flex; align-items: baseline; }
.wordmark .wx { display: inline-block; width: .52em; height: .52em; margin: 0 .02em; transform: translateY(.02em); }
.id-card p { margin: 0; font-size: 13px; color: var(--muted); }
.appicon-demo { display: flex; align-items: center; gap: 14px; }
.squircle { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(160deg, #1f262d, #0b0f12); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 6px 16px rgba(0,0,0,.25); flex: none; }
.squircle svg { width: 40px; height: 40px; }
.tray { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; background: #1b1f23; color: #e8edf2; font-size: 13px; width: fit-content; }
.tray svg { width: 16px; height: 16px; }

/* ---- Janela ---- */
.window { max-width: 1240px; margin: 0 auto; background: var(--window); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-height: 720px; }
.titlebar { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 18px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; }
.brand .mark { width: 28px; height: 28px; }
.brand .wordmark { font-size: 21px; }
.nav { display: flex; gap: 4px; margin-left: 18px; flex-wrap: wrap; }
.nav button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; color: var(--muted); font-size: 14px; }
.nav button[aria-current="page"] { background: var(--surface-2); color: var(--fg); font-weight: 600; }
.titlebar__right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.wc { display: flex; gap: 8px; }
.wc span { width: 14px; height: 14px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); }
.content { flex: 1; padding: 24px; display: flex; flex-direction: column; min-width: 0; }

/* ---- Início (bento) ---- */
.home__head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.home__head h1 { font-size: 30px; }
.home__head p { margin: 4px 0 0; color: var(--muted); }
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(150px, auto); gap: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; text-align: left; }
button.tile { cursor: pointer; transition: border-color .15s; }
button.tile:hover { border-color: var(--accent); }
.tile__label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tile__value { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile__value small { font: 500 14px var(--font-body); color: var(--muted); margin-left: 4px; }
.tile__foot { margin-top: auto; font-size: 13px; color: var(--muted); }
.tile--device { grid-column: span 2; grid-row: span 2; padding: 22px; background: radial-gradient(120% 90% at 70% 35%, var(--stage-a), var(--stage-b)); }
.tile--device h2 { font-size: 26px; }
.device-mini { flex: 1; display: grid; place-items: center; min-height: 250px; }
.device-mini svg { width: min(440px, 94%); height: auto; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.pill--accent { background: var(--accent-soft); border-color: transparent; }
.pill--warn { color: var(--warn); }
.cta { align-self: flex-start; border: 0; border-radius: 999px; padding: 9px 18px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 14px; }
.meter { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.battery-ring { width: 64px; height: 64px; }
.tile--wide { grid-column: span 2; }
.tile--muted { background: var(--surface-2); border-style: dashed; }
.tile--add { align-items: center; justify-content: center; color: var(--muted); border-style: dashed; background: transparent; }
.buds { display: flex; gap: 14px; align-items: center; }
.buds svg { flex: none; }

/* ---- Dispositivo (palco) ---- */
.device__head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.back { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.device__head h1 { font-size: 26px; }
.profiles { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.profiles button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; }
.profiles button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.profiles button:disabled { color: var(--muted); cursor: not-allowed; }
.device__body { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; flex: 1; min-height: 0; }
.stage { position: relative; border-radius: var(--radius-lg); background: radial-gradient(90% 80% at 50% 40%, var(--stage-a), var(--stage-b)); border: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.tabs { display: flex; gap: 4px; padding: 10px; flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; color: var(--muted); font-size: 14px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: var(--shadow); }
.stage > svg { width: 100%; height: auto; display: block; flex: 1; }


.leader { stroke: var(--muted); stroke-width: 1.2; fill: none; opacity: .7; }
.hs { cursor: pointer; }
.hs circle.core { fill: var(--accent); stroke: var(--window); stroke-width: 2.5; }
.hs circle.ring { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; }
.hs.is-selected circle.ring, .hs:hover circle.ring, .hs:focus-visible circle.ring { opacity: .9; }
.hs.is-locked circle.core { fill: var(--muted); }
.hs:focus { outline: none; }
.callout rect { fill: var(--surface); stroke: var(--line); }
.callout.is-selected rect { stroke: var(--accent); stroke-width: 2; }
.callout text { fill: var(--fg); font-family: var(--font-body); }
.callout .c-name { font-size: 12px; fill: var(--muted); letter-spacing: .02em; }
.callout .c-value { font-size: 14px; font-weight: 600; }
@media (prefers-reduced-motion: no-preference) {
  .hs.is-selected circle.ring { animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
}
.chips { display: none; flex-wrap: wrap; gap: 6px; padding: 10px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; }
.chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.stage__note { padding: 0 14px 12px; font-size: 12px; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; overflow: auto; max-height: 660px; }
.panel h2 { font-size: 20px; }
.panel__sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 8px; }
.field__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.field__label { font-weight: 600; font-size: 14px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.hint--warn { color: var(--warn); }
.action-card { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-2); text-align: left; width: 100%; }
.action-card:hover { border-color: var(--accent); }
.action-card__text { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.action-card__title { font-weight: 600; font-size: 14px; }
.change { font-size: 12px; color: var(--accent); white-space: nowrap; }
.keys { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
kbd { font-family: var(--font-mono); font-size: 11.5px; padding: 2px 6px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px; color: var(--fg); white-space: nowrap; }
.keys .plus { color: var(--muted); font-size: 11px; }
.pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pad button { min-height: 86px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-2); padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; font-size: 12px; }
.pad button:hover { border-color: var(--accent); }
.pad .arrow { font-size: 16px; color: var(--accent); line-height: 1; }
.pad .t { font-weight: 600; font-size: 12px; line-height: 1.2; }
.pad .empty { visibility: hidden; }
.pad .center { background: var(--accent-soft); }
.toggle { position: relative; width: 44px; height: 26px; border-radius: 999px; border: 0; background: var(--line); flex: none; transition: background .15s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(18px); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.num { width: 92px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-2); font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.dpi-big { font-family: var(--font-display); font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.dpi-big small { font: 500 14px var(--font-body); color: var(--muted); margin-left: 6px; }
.scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.presets button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-variant-numeric: tabular-nums; }
.presets button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.locked { display: flex; gap: 10px; padding: 12px; border-radius: var(--radius-md); background: var(--surface-2); font-size: 14px; color: var(--muted); }

.picker__back { align-self: flex-start; border: 0; background: transparent; color: var(--muted); padding: 0; font-size: 13px; }
.capture { border: 1.5px dashed var(--accent); border-radius: var(--radius-md); padding: 12px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 6px; cursor: text; }
.capture__title { font-weight: 600; font-size: 14px; }
.capture__detail { font-size: 12px; color: var(--muted); }
.group__title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 4px 0 6px; }
.options { display: flex; flex-direction: column; gap: 4px; }
.option { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid transparent; background: transparent; border-radius: var(--radius-sm); padding: 8px 10px; text-align: left; font-size: 14px; width: 100%; }
.option:hover { background: var(--surface-2); border-color: var(--line); }
.badge { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--warn); border: 1px solid var(--line); }

.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius-md); background: var(--surface-2); font-size: 13.5px; }
.check b { display: block; }
.sev { flex: none; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
.sev--err { color: var(--err); } .sev--warn { color: var(--warn); } .sev--ok { color: var(--ok); }
pre.cfg { margin: 0; padding: 12px; border-radius: var(--radius-md); background: var(--surface-2); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; line-height: 1.55; overflow: auto; max-height: 300px; }

.applybar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-top: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.applybar__msg { display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 0; flex: 1; }
.applybar__msg .count { font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-size: 14px; }
.btn--primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.steps { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.steps span.done { color: var(--ok); }
.steps span.now { color: var(--fg); font-weight: 600; }

.rules { display: flex; flex-direction: column; gap: 8px; max-width: 720px; }
.rule { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface); }
.rule__app { display: flex; align-items: center; gap: 10px; min-width: 0; }
.appmono { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--on-accent); background: var(--accent); flex: none; }
.example-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--warn); }

@media (max-width: 1060px) {
  .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .device__body { grid-template-columns: minmax(0, 1fr); }
  .panel { max-height: none; }
  .identity { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .content { padding: 16px; }
  .bento, .identity { grid-template-columns: minmax(0, 1fr); }
  .tile--device, .tile--wide { grid-column: auto; grid-row: auto; }
  .nav { margin-left: 0; }
  .wc { display: none; }
  .callout, .leader { display: none; }
  .chips { display: flex; }
  .applybar { padding: 12px 16px; }
  .rule { grid-template-columns: minmax(0, 1fr); }
  .wordmark { font-size: 36px; }
}
</style>

<div class="proto" role="region" aria-label="Controles do protótipo">
  <div class="proto__title">Protótipo Nexo · Fase 2 · v4<small>Ciano, logo Constelação e ilustração realista escolhidos · nada é aplicado de verdade</small></div>
  <div class="seg" role="group" aria-label="Tema">
    <span class="seg__label">Tema</span>
    <button type="button" data-theme-choice="system" aria-pressed="true">Sistema</button>
    <button type="button" data-theme-choice="light" aria-pressed="false">Claro</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false">Escuro</button>
  </div>
</div>

<section class="identity" id="identity" aria-label="Identidade visual"></section>

<div class="window">
  <header class="titlebar">
    <div class="brand" id="brand"></div>
    <nav class="nav" aria-label="Seções">
      <button type="button" data-nav="home" aria-current="page">Dispositivos</button>
      <button type="button" data-nav="apps">Perfis por app</button>
    </nav>
    <div class="titlebar__right">
      <span class="status"><span class="dot"></span>logid 0.3.5 ativo</span>
      <div class="wc" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </header>
  <main class="content" id="content"></main>
  <footer class="applybar" id="applybar" hidden></footer>
</div>

<script>
"use strict";

// ---------- Dados reais: /etc/logid.cfg do usuário (27/10/2026) + capacidades do spike S2 ----------
const DPI_RANGE = { min: 200, max: 8000, step: 50 };
const initialConfig = () => ({
  dpi: 1600,
  smartshift: { on: true, threshold: 20 },
  hires: false, invert: false,
  thumb: {
    invert: true, interval: 3,
    left: { type: "keypress", keys: ["KEY_LEFTCTRL", "KEY_LEFTSHIFT", "KEY_TAB"] },
    right: { type: "keypress", keys: ["KEY_LEFTCTRL", "KEY_TAB"] },
  },

  if (a.type === "changedpi") f.push(["inc", a.inc]);

  if (a.type === "gestures") {
    const dirs = [["none", "None"], ["up", "Up"], ["down", "Down"], ["left", "Left"], ["right", "Right"]];
    f.push(["gestures", L(...dirs.filter(([k]) => a.gestures[k]).map(([k, n]) => G(["direction", n], ["mode", "OnRelease"], ["action", actionNode(a.gestures[k])])))]);

  const thumbGesture = (a) => G(["mode", "OnInterval"], ["interval", c.thumb.interval], ["action", actionNode(a)]);
  const dev = [["name", "MX Master 3S"], ["dpi", c.dpi],
    ["smartshift", G(["on", c.smartshift.on], ["threshold", c.smartshift.threshold])],
    ["hiresscroll", G(["hires", c.hires], ["invert", c.invert], ["target", false])],
    ["thumbwheel", G(["divert", true], ["invert", c.thumb.invert], ["left", thumbGesture(c.thumb.left)], ["right", thumbGesture(c.thumb.right)])]];

function writeValue(v, depth) {
  const ind = "    ".repeat(depth);

    if (!v.g.length) return "{}";
    return "{\n" + v.g.map(([k, x]) => ind + "    " + k + ": " + writeValue(x, depth + 1) + ";\n").join("") + ind + "}";
  }
  if (v && v.l) return "(\n" + v.l.map((x) => ind + "    " + writeValue(x, depth + 1)).join(",\n") + "\n" + ind + ")";
  if (v && v.a) return "[" + v.a.map((x) => writeValue(x, depth)).join(", ") + "]";
  if (v && v.hex !== undefined) return "0x" + v.hex.toString(16);
  if (typeof v === "string") return JSON.stringify(v);
  return String(v);
}

  const highlight = (cx, cy, w, rot) => '<rect x="' + (cx - w / 2 + 6) + '" y="' + (cy - 6) + '" width="' + (w - 12) + '" height="2" rx="1" fill="#ffffff" opacity=".16" transform="rotate(' + rot + " " + cx + " " + cy + ')"/>';
  return defs +
    '<ellipse cx="280" cy="306" rx="236" ry="22" fill="var(--drop)" filter="' + url("shadow") + '"/>' +
    '<path d="' + V.outline + '" fill="' + url("side") + '"/>' +
    '<g clip-path="' + url("clip") + '">' +
      '<path d="' + V.outline + '" fill="' + url("front") + '"/>' +
      '<path d="' + V.top + '" fill="' + url("top") + '"/>' +
      '<path d="' + V.shoulder + '" fill="none" stroke="#ffffff" stroke-opacity=".32" stroke-width="5" filter="' + url("blur") + '"/>' +
      '<path d="' + V.topEdge + '" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="3" filter="' + url("blur") + '"/>' +
      '<path d="' + V.shelf + '" fill="' + url("shelf") + '"/>' +

    "</g>" +
    '<path d="' + V.shoulder + '" fill="none" stroke="#0b0d0f" stroke-opacity=".55" stroke-width="1.2"/>' +
    '<path d="' + V.seam + '" fill="none" stroke="#0a0c0e" stroke-width="2.4"/>' +
    '<path d="' + V.seam + '" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.2" transform="translate(-2 0)"/>' +
    '<path d="' + V.split + '" fill="none" stroke="#0a0c0e" stroke-width="2.2"/>' +
    part("", P.smartshift, ' fill="' + url("rubber") + '" stroke="#0a0c0e" stroke-width="1.3"') +
    drawWheel(id, url) +
    drawThumbwheel(url) +
    part("", P.back, ' fill="' + url("rubber") + '" stroke="#0a0c0e" stroke-width="1.4"') + highlight(P.back[0], P.back[1], P.back[2], P.back[5]) +
    part("", P.forward, ' fill="' + url("rubber") + '" stroke="#0a0c0e" stroke-width="1.4"') + highlight(P.forward[0], P.forward[1], P.forward[2], P.forward[5]) +

    '<circle cx="' + LED[0] + '" cy="' + LED[1] + '" r="5" fill="#53e09a" opacity=".55" filter="' + url("glow") + '"/><circle cx="' + LED[0] + '" cy="' + LED[1] + '" r="1.8" fill="#a3f6cb"/>';
}

function mouseSvg(withStage) {
  if (!withStage) return '<svg viewBox="30 50 520 290" role="img" aria-label="Ilustração do MX Master 3S">' + drawMouse("mini") + "</svg>";
  const OX = 200, OY = 70, W = 960, LW = 170, LH = 50;
  // Cada fileira fica perto dos pontos que descreve: linhas curtas e sem cruzamentos.
  const COLS = { T: [60, 240, 420, 600], B: [150, 330, 510, 690] };
  // [id, ponto no mouse, fileira (T = em cima, B = embaixo), coluna 0–3, cotovelo opcional]. Ordem escolhida para as
  // linhas não se cruzarem. A roda lateral fica acima de Voltar/Avançar: a linha dela sai para a direita (para trás
  // do mouse) antes de descer, senão passaria por cima de Voltar e do botão de gestos.
  const spots = [
    ["50", 98, 176, "T", 0], ["51", 102, 143, "T", 1], ["52", 172, 121, "T", 2], ["c4", 216, 119, "T", 3],
    ["56", 193, 222, "B", 0], ["c3", 250, 258, "B", 1], ["53", 261, 222, "B", 2], ["thumb", 256, 193, "B", 3, [318, 193]],
  ];
  const c = state.config;
  const value = (id) => {
    if (id === "50" || id === "51") return "Não remapeável";
    if (id === "thumb") return short(c.thumb.right) + " · " + short(c.thumb.left);
    return short(c.buttons[id], ORIGINAL[id]);
  };
  let callouts = "", hotspots = "";
  for (const [id, mx, my, row, col, via] of spots) {
    const x = OX + mx, y = OY + my;
    const lx = COLS[row][col], ly = row === "T" ? 12 : 438;
    const ax = lx + LW / 2, ay = row === "T" ? ly + LH : ly;
    const sel = state.selected === id && state.tab === "buttons" ? " is-selected" : "";
    const val = value(id);
    const elbow = via ? " L" + (OX + via[0]) + "," + (OY + via[1]) : "";
    callouts += '<path class="leader" d="M' + x + "," + y + elbow + " L" + ax + "," + ay + '"/>' +
      '<g class="callout' + sel + '" data-select="' + id + '" style="cursor:pointer"><rect x="' + lx + '" y="' + ly + '" width="' + LW + '" height="' + LH + '" rx="10"/>' +
      '<text class="c-name" x="' + (lx + 12) + '" y="' + (ly + 19) + '">' + esc(BUTTONS[id].name) + "</text>" +
      '<text class="c-value" x="' + (lx + 12) + '" y="' + (ly + 38) + '">' + esc(val.length > 21 ? val.slice(0, 20) + "…" : val) + "</text></g>";
    hotspots += '<g class="hs' + sel + (BUTTONS[id].locked ? " is-locked" : "") + '" data-select="' + id + '" tabindex="0" role="button" aria-label="' + esc(BUTTONS[id].name + ": " + val) + '">' +
      '<circle class="ring" cx="' + x + '" cy="' + y + '" r="12"/><circle class="core" cx="' + x + '" cy="' + y + '" r="6.5"/></g>';
  }
  return '<svg viewBox="0 0 ' + W + ' 500" aria-label="MX Master 3S em perspectiva com os botões configuráveis">' + callouts +
    '<g transform="translate(' + OX + "," + OY + ')">' + drawMouse("stage") + "</g>" + hotspots + "</svg>";
}

function actionCard(path, fallback) {
  const a = getAt(path), d = describe(a, fallback);
  return '<button type="button" class="action-card" data-pick="' + path + '"><span class="action-card__text"><span class="action-card__title">' + esc(d.title) + "</span>" +
    (d.keys ? keycaps(d.keys) : d.sub ? '<span class="hint">' + esc(d.sub) + "</span>" : "") + '</span><span class="change">Alterar</span></button>';
}

function renderButtonPanel() {
  const id = state.selected, info = BUTTONS[id];
  let html = "<div><h2>" + esc(info.name) + '</h2><p class="panel__sub">' + (info.cid !== undefined ? '<span class="mono">cid 0x' + info.cid.toString(16) + "</span> · " : "") + (info.locked ? "fixo" : id === "thumb" ? "roda horizontal de polegar" : "remapeável · aceita gestos") + "</p></div>";
  if (info.locked) {
    return html + '<div class="locked"><span aria-hidden="true">🔒</span><span>O mouse não permite desviar este clique (Remappable = false no logid). Ele sempre funciona como clique normal.</span></div>';
  }
  if (id === "thumb") {
    const t = state.config.thumb;
    return html +
      '<div class="field"><span class="field__label">Girar para a direita</span>' + actionCard("thumb.right") + "</div>" +
      '<div class="field"><span class="field__label">Girar para a esquerda</span>' + actionCard("thumb.left") + "</div>" +
      '<div class="field"><div class="field__row"><span class="field__label">Sensibilidade</span><span class="mono">' + t.interval + '</span></div>' +
      '<input id="interval" type="range" min="1" max="10" step="1" value="' + t.interval + '" aria-label="Sensibilidade da roda lateral">' +
      '<p class="hint">1 = dispara a cada pequeno giro. O Nexo nunca grava 0: no logid isso derruba o daemon.</p></div>' +
      '<div class="field__row"><span class="field__label">Inverter direção</span><button type="button" class="toggle" role="switch" aria-label="Inverter direção" aria-checked="' + t.invert + '" data-toggle="thumb.invert"></button></div>';
  }
  const action = state.config.buttons[id];
  html += '<div class="field"><span class="field__label">Ação</span>' + actionCard(id, ORIGINAL[id]) + "</div>";
  if (action && action.type === "gestures") {
    const cell = (dir, arrow, label) => {
      const a = action.gestures[dir], d = describe(a, "Nada");
      return '<button type="button" data-pick="' + id + "." + dir + '"' + (dir === "none" ? ' class="center"' : "") + '><span class="arrow">' + arrow + '</span><span class="t">' + esc(d.title) + "</span>" +
        (d.keys ? keycaps(d.keys) : "") + '<span class="hint">' + label + "</span></button>";
    };
    html += '<div class="field"><span class="field__label">Segure o botão e mova o mouse</span><div class="pad">' +
      '<span class="empty"></span>' + cell("up", "↑", "para cima") + '<span class="empty"></span>' +
      cell("left", "←", "para a esquerda") + cell("none", "●", "só clicar") + cell("right", "→", "para a direita") +
      '<span class="empty"></span>' + cell("down", "↓", "para baixo") + '<span class="empty"></span></div>' +
      '<p class="hint">Cada gesto dispara ao soltar o botão (modo OnRelease).</p></div>';
  }
  return html;
}

function renderPicker() {

  let html = '<button type="button" class="picker__back" data-close-picker>← Voltar</button>' +

    '<button type="button" class="option" disabled style="color:var(--muted);cursor:not-allowed"><span>Trocar de perfil</span><span class="hint">crie outro perfil antes</span></button></div></div>';
  return html;
}

    '<div class="profiles" role="group" aria-label="Perfis"><button type="button" aria-pressed="true">Padrão</button><button type="button" disabled title="Perfis múltiplos chegam na Fase 5">＋ Novo perfil</button></div></div>' +
    '<div class="device__body"><section class="stage" aria-label="Palco do dispositivo"><div class="tabs" role="tablist">' +
    tabs.map(([k, l]) => '<button type="button" role="tab" data-tab="' + k + '" aria-selected="' + (tab === k) + '">' + l + "</button>").join("") + "</div>" +
    mouseSvg(true) +
    '<div class="chips">' + Object.keys(BUTTONS).map((id) => '<button type="button" data-select="' + id + '" aria-pressed="' + (state.selected === id && tab === "buttons") + '">' + esc(BUTTONS[id].name) + "</button>").join("") + "</div>" +
    '<p class="stage__note">Ilustração original do Nexo. Clique num ponto para configurar o botão.</p></section>' +
    '<aside class="panel" aria-live="polite">' + panel + "</aside></div>";
}

function renderApps() {
  return '<div class="home__head"><div><h1>Perfis por aplicativo</h1><p>O perfil do mouse troca sozinho conforme o app em foco, sem pedir senha.</p></div></div>' +
    '<div class="rules"><span class="example-tag">Exemplo de como ficará (Fase 6)</span>' +
    [["C", "Visual Studio Code", "Código"], ["F", "Firefox", "Navegação"], ["G", "GIMP", "Precisão (DPI 800)"]].map(([i, app, p]) =>
      '<div class="rule"><span class="rule__app"><span class="appmono">' + i + "</span><span>" + app + '</span></span><span class="hint">usa o perfil</span><span class="pill pill--accent" style="justify-self:start">' + p + "</span></div>").join("") +
    '<div class="rule"><span class="rule__app"><span class="appmono" style="background:var(--muted)">*</span><span>Qualquer outro app</span></span><span class="hint">usa o perfil</span><span class="pill" style="justify-self:start">Padrão</span></div>' +
    '<p class="hint">Requer a extensão do GNOME “nexo-focus”: no Wayland só o GNOME Shell sabe qual janela está em foco.</p></div>';
}

function renderApplyBar() {
  const bar = $("#applybar"), n = changeCount(), errs = issues().filter((i) => i.sev === "err").length;
  if (state.applying !== null) {
    const steps = ["Autorização (senha 1× por sessão)", "Backup do logid.cfg atual", "Gravação atômica", "Reinício do logid", "Verificação"];
    bar.hidden = false;
    bar.innerHTML = '<div class="steps">' + steps.map((s, i) => '<span class="' + (i < state.applying ? "done" : i === state.applying ? "now" : "") + '">' + (i < state.applying ? "✓ " : "") + s + "</span>").join("") + "</div>";
    return;
  }
  if (state.toast) {
    bar.hidden = false;
    bar.innerHTML = '<div class="applybar__msg"><span class="dot"></span><span>' + esc(state.toast) + '</span></div><button type="button" class="btn" data-dismiss>Fechar</button>';
    return;
  }
  if (!n && !errs) { bar.hidden = true; bar.innerHTML = ""; return; }
  bar.hidden = false;
  bar.innerHTML = '<div class="applybar__msg">' + (errs ? '<span class="sev sev--err">Bloqueado</span><span>' + errs + " erro(s) impedem aplicar. Veja a aba Avançado.</span>" :
    '<span class="count">' + n + " alteraç" + (n === 1 ? "ão" : "ões") + '</span><span class="hint">ainda não aplicada' + (n === 1 ? "" : "s") + " ao mouse</span>") + "</div>" +
    '<button type="button" class="btn" data-discard' + (n ? "" : " disabled") + '>Descartar</button><button type="button" class="btn btn--primary" data-apply' + (n && !errs ? "" : " disabled") + ">Aplicar</button>";
}

function render() {
  $("#content").innerHTML = state.screen === "home" ? renderHome() : state.screen === "apps" ? renderApps() : renderDevice();
  document.querySelectorAll(".nav [data-nav]").forEach((b) => b.setAttribute("aria-current", (b.dataset.nav === state.screen || (b.dataset.nav === "home" && state.screen === "device")) ? "page" : "false"));
  renderApplyBar();
  const cap = $("#capture");
  if (cap && state.capture) cap.focus();
}

// ---------- Interação ----------
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-select], [data-open]");
  if (!t) return;
  const d = t.dataset;
  if (d.themeChoice) return setTheme(d.themeChoice);
  if (d.nav) { state.screen = d.nav; state.picker = null; return render(); }
  if (d.open) { state.screen = "device"; state.tab = d.tab || "buttons"; state.picker = null; return render(); }
  if (d.select) { state.selected = d.select; state.tab = "buttons"; state.picker = null; return render(); }
  if (d.tab) { state.tab = d.tab; state.picker = null; return render(); }
  if (d.pick) { state.picker = d.pick; state.capture = null; return render(); }
  if (d.closePicker !== undefined) { state.picker = null; return render(); }
  if (d.set === "original") { setAt(state.picker, null); state.picker = null; return render(); }
  if (d.set === "gestures") {
    setAt(state.picker, { type: "gestures", gestures: { none: { type: "none" }, up: null, down: null, left: null, right: null } });
    state.picker = null; return render();
  }
  if (d.preset) {
    const [group, i] = d.preset.split("|"), g = PRESETS.find((x) => x.group === group);
    setAt(state.picker, { type: "keypress", keys: g.items[+i][1].slice() });
    state.picker = null; return render();
  }
  if (d.mouse) { setAt(state.picker, clone(MOUSE_ACTIONS[+d.mouse].action)); state.picker = null; return render(); }
  if (d.useCapture !== undefined) { setAt(state.picker, { type: "keypress", keys: state.capture }); state.picker = null; state.capture = null; return render(); }
  if (d.toggle) {
    const c = state.config;
    if (d.toggle === "smartshift.on") c.smartshift.on = !c.smartshift.on;
    else if (d.toggle === "thumb.invert") c.thumb.invert = !c.thumb.invert;
    else if (d.toggle === "simulate") state.simulate = !state.simulate;
    else c[d.toggle] = !c[d.toggle];
    return render();
  }
  if (d.dpi) { state.config.dpi = +d.dpi; return render(); }
  if (d.showCfg !== undefined) { state.showCfg = !state.showCfg; return render(); }
  if (d.discard !== undefined) { state.config = clone(state.applied); state.picker = null; return render(); }
  if (d.apply !== undefined) return apply();
  if (d.dismiss !== undefined) { state.toast = ""; return render(); }
  if (d.toast) { state.toast = d.toast; return render(); }
});
document.addEventListener("keydown", (e) => {
  const hs = e.target.closest && e.target.closest('.hs[role="button"]');
  if (hs && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); state.selected = hs.dataset.select; state.tab = "buttons"; state.picker = null; render(); return; }
  if (e.target.id !== "capture") return;
  if (e.key === "Tab" && !e.ctrlKey && !e.altKey && !e.metaKey && !e.shiftKey && !(state.capture && state.capture.length)) return;
  e.preventDefault();
  const name = CODE_TO_EVDEV[e.code];
  if (!name) return;
  const label = /^Key[A-Z]$|^Digit\d$/.test(e.code) || MODIFIERS.has(name) || KEY_LABEL[name] ? undefined : (e.key && e.key.length === 1 ? e.key.toUpperCase() : undefined);
  const mods = [];
  if (e.ctrlKey && name !== "KEY_LEFTCTRL" && name !== "KEY_RIGHTCTRL") mods.push("KEY_LEFTCTRL");
  if (e.shiftKey && name !== "KEY_LEFTSHIFT" && name !== "KEY_RIGHTSHIFT") mods.push("KEY_LEFTSHIFT");
  if (e.altKey && name !== "KEY_LEFTALT" && name !== "KEY_RIGHTALT") mods.push("KEY_LEFTALT");
  if (e.metaKey && name !== "KEY_LEFTMETA" && name !== "KEY_RIGHTMETA") mods.push("KEY_LEFTMETA");
  state.capture = [...mods, label ? { name, label } : name];
  render();
});
document.addEventListener("input", (e) => {
  const id = e.target.id, v = +e.target.value;
  if (id === "dpi-range") { state.config.dpi = v; return render(); }
  if (id === "dpi-num") {
    state.config.dpi = Number.isFinite(v) ? Math.trunc(v) : 0; renderApplyBar();
    const big = $(".dpi-big"), eff = effectiveDpi(state.config.dpi);
    if (big) big.innerHTML = (eff ?? "—") + "<small>DPI</small>";
    return;
  }
  if (id === "threshold") { state.config.smartshift.threshold = v; return render(); }
  if (id === "interval") { state.config.thumb.interval = Math.max(1, v); return render(); }
});
document.addEventListener("change", (e) => { if (e.target.id === "dpi-num") render(); });

const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function apply() {
  state.applying = 0; state.picker = null; render();
  const tick = () => {
    state.applying += 1;
    if (state.applying >= 5) {
      state.applying = null; state.applied = clone(state.config);
      state.toast = "Aplicado. O logid reiniciou em 0,4 s e o mouse já usa a nova configuração.";
      return render();
    }
    renderApplyBar(); setTimeout(tick, reduced ? 120 : 520);
  };
  setTimeout(tick, reduced ? 120 : 520);
}

// ---------- Preferências locais deste navegador ----------
const root = document.documentElement;
function store(k, v) { try { localStorage.setItem(k, v); } catch (_) { /* armazenamento indisponível */ } }
function load(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function pressed(sel, key, value) { document.querySelectorAll(sel).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset[key] === value))); }
function setTheme(t) {
  if (t === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  pressed("[data-theme-choice]", "themeChoice", t);
  store("nexo-theme", t);
}
setTheme(load("nexo-theme") || "system");
renderIdentity();
render();
</script>
