# Continuous integration. Every job must stay green on `main`.
# Steps that depend on code that does not exist yet are skipped automatically
# (hashFiles guards) and start running as soon as the files appear.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # ubuntu-24.04 ships Python 3; the checker uses only the standard library.
      - run: python3 -I tool/check_docs_links.py

  dart:
    name: Dart & Flutter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Flutter version (.fvmrc)
        id: pin
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.flutter }}
          channel: stable
          cache: true

      - name: Flutter version matches .fvmrc
        run: tool/check_flutter_version.sh

      - name: Resolve workspace
        if: hashFiles('pubspec.yaml') != ''
        run: dart pub get

      - name: Format
        if: hashFiles('pubspec.yaml') != ''
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: hashFiles('pubspec.yaml') != ''
        run: dart analyze --fatal-infos

      # Reference parser for the differential tests: the real libconfig++
      # (same 1.7.3 release logid links to on Ubuntu 24.04 and 26.04).
      - name: Build reference libconfig parser
        if: hashFiles('tool/libconfig_check/main.cpp') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libconfig++-dev
          tool/libconfig_check/build.sh

      - name: Test (Dart packages)
        if: hashFiles('packages/*/test/**/*_test.dart') != ''
        env:
          NEXO_REQUIRE_LIBCONFIG_CHECK: "1"
        run: |
          for pkg in packages/*/; do
            if [ -d "$pkg/test" ]; then
              echo "::group::$pkg"
              (cd "$pkg" && dart test)
              echo "::endgroup::"
            fi
          done
