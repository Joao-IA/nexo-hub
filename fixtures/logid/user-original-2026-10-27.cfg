devices: (
{
    name: "MX Master 3S";
    smartshift: { on: true; threshold: 20; };
    hiresscroll: { hires: false; invert: false; target: false; };
    dpi: 1600;

    thumbwheel: {
        divert: true;
        invert: true;
        left:  { mode: "OnInterval"; interval: 3; action = { type: "Keypress"; keys: ["KEY_LEFTCTRL", "KEY_LEFTSHIFT", "KEY_TAB"]; }; };
        right: { mode: "OnInterval"; interval: 3; action = { type: "Keypress"; keys: ["KEY_LEFTCTRL", "KEY_TAB"]; }; };
    };

    buttons: (
        {
            cid: 0xc3;
            action = {
                type: "Gestures";
                gestures: (
                    { direction: "None";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA"]; }; },
                    { direction: "Up";    mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_S"]; }; },
                    { direction: "Down";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTCTRL", "KEY_C"]; }; },
                    { direction: "Left";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTCTRL", "KEY_V"]; }; },
                    { direction: "Right"; mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTCTRL", "KEY_LEFTALT", "KEY_RIGHT"]; }; }
                );
            };
        },
        { cid: 0xc4; action = { type: "ToggleSmartshift"; }; }
    );
}
);
